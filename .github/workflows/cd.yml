name: CD — Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # ghcr.io/tu-usuario/planster-editor-app

jobs:
  # ─── Build y push de imagen Docker a GHCR ───────────────────────────────────
  build-and-push:
    name: Build Docker Image → GHCR
    # Native arm64 runner (free on public repos) — the Coolify VPS is arm64-only,
    # so there's no reason to also build amd64, and building arm64 natively here
    # instead of emulating it with QEMU on an amd64 runner is dramatically faster
    # for a CPU-heavy Next.js build (`npm run build` under QEMU emulation could
    # take well over an hour; natively it's a normal few-minute build).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # The Coolify VPS runs on arm64 only — see the runs-on comment above.
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ─── Deploy en Coolify vía webhook ──────────────────────────────────────────
  deploy:
    name: Deploy → VPS via Coolify
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Trigger Coolify deploy webhook
        run: |
          curl --fail -X GET \
            "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

      - name: Notify deploy success
        if: success()
        run: |
          echo "✅ Deploy triggered successfully"
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"

      - name: Notify deploy failure
        if: failure()
        run: |
          echo "❌ Deploy failed"
          exit 1